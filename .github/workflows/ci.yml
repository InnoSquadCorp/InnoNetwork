name: CI
run-name: >-
  ${{ inputs.dependabot_merge_pr != '' && format('CI / Dependabot merge #{0}', inputs.dependabot_merge_pr) || 'CI' }}

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      dependabot_merge_pr:
        description: 'Trusted recovery only: actual merged Dependabot PR at current main'
        type: string
        required: false
        default: ''

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.dependabot_merge_pr != '' && format('dependabot-{0}', inputs.dependabot_merge_pr) || 'validation' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci-plan:
    name: CI Plan
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      reuse: ${{ steps.reuse.outputs.proof }}
      lint: ${{ steps.plan.outputs.lint }}
      dead-code: ${{ steps.plan.outputs.dead-code }}
      parallel-tests: ${{ steps.plan.outputs.parallel-tests }}
      apple-platform-build-smoke: ${{ steps.plan.outputs.apple-platform-build-smoke }}
      thread-sanitizer: ${{ steps.plan.outputs.thread-sanitizer }}
      post_merge: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dependabot_merge_pr != '')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify actual post-merge main origin
        if: inputs.dependabot_merge_pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          MERGED_PR: ${{ inputs.dependabot_merge_pr }}
          EVENT_REF: ${{ github.ref }}
        run: |
          [[ "$EVENT_REF" == 'refs/heads/main' ]] || { echo 'Recovery must run on main.' >&2; exit 1; }
          python3 -B Scripts/dependabot-merge-policy.py verify-post-merge --pr "$MERGED_PR" --expected-sha "$GITHUB_SHA"
      - name: Admit equivalent-tree PR verification for main
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B Scripts/main-ci-reuse-policy.py --event "$GITHUB_EVENT_PATH"
      - name: Plan exact changed paths
        id: plan
        env:
          CI_REUSE: ${{ steps.reuse.outputs.proof }}
        run: python3 -B Scripts/ci-policy.py plan --event "$GITHUB_EVENT_PATH" --output .build/ci-plan.json
      - name: Preserve change selection evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-plan-${{ github.sha }}-${{ github.run_attempt }}
          path: .build/ci-plan.json
          if-no-files-found: error


  policy:
    name: CI and public operations policy
    needs: ci-plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify CI selection and public operations
        run: |
          python3 -B -m unittest discover -s Scripts/automation-tests -p 'test_*.py'
          python3 -B Scripts/tests/test_benchmark_protocol.py
          python3 -B Scripts/tests/test_benchmark_protocol_integration.py
          python3 -B Scripts/tests/test_compare_benchmark_runs.py
          python3 -B Scripts/tests/test_ci_cache.py
          python3 -B Scripts/tests/test_consumer_ci.py
          python3 -B Scripts/check-public-operations.py
          python3 -B Scripts/check_required_status_checks.py
          ruby Scripts/check_consumer_ci_contract.rb
          ruby Scripts/tests/test_consumer_ci_contract.rb
          python3 -B Scripts/check_release_workflow_contract.py
          python3 -B Scripts/tests/test_check_release_workflow_contract.py

  dependency-review:
    needs: ci-plan
    name: Dependency Review
    if: fromJSON(needs.ci-plan.outputs.plan).jobs.dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout trusted dependency verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Verify immutable dependency transition
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          gh api \
            --method GET \
            -H 'Accept: application/vnd.github.raw+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/contents/Package.resolved" \
            -f ref="$HEAD_SHA" > "$RUNNER_TEMP/head.Package.resolved"
          python3 -I Scripts/generate_dependency_snapshot.py \
            --verify-package-resolved-transition \
            Package.resolved \
            "$RUNNER_TEMP/head.Package.resolved"

      - name: Wait for complete dependency snapshots
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 18); do
            headers="$RUNNER_TEMP/dependency-review-$attempt.headers"
            body="$RUNNER_TEMP/dependency-review-$attempt.json"
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --retry 3 \
              --dump-header "$headers" \
              --output "$body" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'Cache-Control: no-cache' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/dependency-graph/compare/$BASE_SHA...$HEAD_SHA"

            if python3 - "$headers" "$body" <<'PY'
          import base64
          import json
          import sys
          from pathlib import Path

          headers = {}
          for line in Path(sys.argv[1]).read_text(encoding="utf-8").splitlines():
              name, separator, value = line.partition(":")
              if separator:
                  headers[name.lower()] = value.strip()

          warning_header = "x-github-dependency-graph-snapshot-warnings"
          if warning_header not in headers:
              print("Dependency graph response omitted the snapshot warning header.")
              raise SystemExit(1)
          try:
              warning = base64.b64decode(headers[warning_header], validate=True).decode()
          except (ValueError, UnicodeError) as error:
              print(f"Dependency graph returned an invalid snapshot warning: {error}")
              raise SystemExit(1)

          with Path(sys.argv[2]).open(encoding="utf-8") as source:
              changes = json.load(source)
          if not isinstance(changes, list):
              print("Dependency graph comparison response is not an array.")
              raise SystemExit(1)
          if warning:
              print(f"Dependency snapshots are not ready: {warning}")
              raise SystemExit(1)
          print(f"Dependency snapshots are complete ({len(changes)} change(s)).")
          PY
            then
              break
            fi

            if [[ "$attempt" -eq 18 ]]; then
              echo "::error::Dependency snapshots remained incomplete for 180 seconds."
              exit 1
            fi
            sleep 10
          done

      - name: Review dependency changes
        # GitHub's dependency-review API requires the repository dependency
        # graph setting to be enabled. A missing graph or a rejected dependency
        # change is a required PR gate rather than an advisory signal.
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ github.event.pull_request.base.sha }}
          head-ref: ${{ github.event.pull_request.head.sha }}
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 180


  lint:
    needs: ci-plan
    name: Lint (swift-format)
    if: needs.ci-plan.outputs.lint == 'true'
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.1.app

      - name: Show swift-format version
        run: xcrun swift-format --version

      - name: Run swift-format lint
        run: bash Scripts/format.sh --lint


  dead-code:
    needs: ci-plan
    name: Lint (Periphery)
    if: needs.ci-plan.outputs.dead-code == 'true'
    runs-on: xcode-27
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app

      - name: Cache SwiftPM artifacts
        uses: ./.github/actions/swiftpm-cache
        with:
          profile: dead-code

      - name: Install Periphery 3.8.0
        env:
          PERIPHERY_VERSION: "3.8.0"
          PERIPHERY_SHA256: "07d4e286e31dd79164df39097e0b59f533c94badbe18158464a455ea88a166d7"
        run: |
          set -euo pipefail

          archive="$RUNNER_TEMP/periphery-$PERIPHERY_VERSION.zip"
          install_dir="$RUNNER_TEMP/periphery-$PERIPHERY_VERSION"

          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$archive" \
            "https://github.com/peripheryapp/periphery/releases/download/$PERIPHERY_VERSION/periphery-$PERIPHERY_VERSION.zip"

          printf '%s  %s\n' "$PERIPHERY_SHA256" "$archive" \
            | shasum -a 256 -c -

          mkdir -p "$install_dir"
          ditto -x -k "$archive" "$install_dir"

          codesign --verify --strict "$install_dir/periphery"
          codesign --verify --strict "$install_dir/libIndexStore.dylib"

          actual_version="$("$install_dir/periphery" version)"
          test "$actual_version" = "$PERIPHERY_VERSION"
          echo "Periphery $actual_version"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: xcrun swift package resolve

      - name: Run Periphery scan
        run: |
          set -eo pipefail
          # Periphery 3.8 still expects the native SwiftPM index-store layout;
          # Swift 6.4's default SwiftBuild layout is not discoverable yet.
          periphery scan --config .periphery.yml -- --build-system native

      - name: Report cache observations
        if: always()
        run: python3 -B Scripts/ci-cache.py report --profile dead-code

  build-and-test:
    needs: ci-plan
    name: Build and Test (SwiftPM) — Xcode ${{ matrix.xcode.label }}
    if: fromJSON(needs.ci-plan.outputs.plan).jobs.build-and-test
    runs-on: ${{ matrix.xcode.runner }}
    timeout-minutes: 45
    # Run the toolchain matrix in parallel so a green / red signal is
    # available per Xcode without serializing wall-clock time.
    strategy:
      fail-fast: false
      matrix:
        xcode:
          # Pinned canonical toolchain — the source of truth for `swift
          # build` reproducibility and the version benchmarked / signed
          # in the release workflow.
          - label: "26.0.1"
            runner: macos-15
            path: /Applications/Xcode_26.0.1.app
            required: true
          # Keep the newest supported SDK blocking alongside the Swift 6.2
          # canonical toolchain so forward-compatibility regressions surface.
          - label: "27.0"
            runner: xcode-27
            path: /Applications/Xcode.app
            required: true
    continue-on-error: ${{ !matrix.xcode.required }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          sudo xcode-select -s ${{ matrix.xcode.path }}

      - name: Cache SwiftPM artifacts
        uses: ./.github/actions/swiftpm-cache
        with:
          profile: build-and-test

      - name: Show Xcode and Swift versions
        run: |
          xcodebuild -version
          xcrun swift --version

      - name: Check Swift tools compatibility
        id: toolchain-compatibility
        env:
          REQUIRED_TOOLCHAIN: ${{ matrix.xcode.required }}
        run: |
          set -eo pipefail

          package_tools="$(sed -nE 's#^// swift-tools-version: *([0-9]+)\.([0-9]+).*#\1.\2#p' Package.swift | head -n 1)"
          swift_version="$(xcrun swift --version | sed -nE 's/^Apple Swift version ([0-9]+)\.([0-9]+).*/\1.\2/p' | head -n 1)"

          if [[ -z "$package_tools" || -z "$swift_version" ]]; then
            echo "::error::Unable to determine Package.swift tools version or active Swift version."
            exit 1
          fi

          tools_major="${package_tools%%.*}"
          tools_minor="${package_tools##*.}"
          swift_major="${swift_version%%.*}"
          swift_minor="${swift_version##*.}"

          if (( swift_major > tools_major || (swift_major == tools_major && swift_minor >= tools_minor) )); then
            echo "compatible=true" >> "$GITHUB_OUTPUT"
            echo "Active Swift ${swift_version} supports Package.swift tools ${package_tools}."
          elif [[ "$REQUIRED_TOOLCHAIN" == "true" ]]; then
            echo "compatible=false" >> "$GITHUB_OUTPUT"
            echo "::error::Required toolchain Swift ${swift_version} cannot load Package.swift tools ${package_tools}."
            exit 1
          else
            echo "compatible=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping non-required ${GITHUB_JOB} matrix leg because Swift ${swift_version} cannot load Package.swift tools ${package_tools}."
          fi

      - name: Resolve dependencies
        if: steps.toolchain-compatibility.outputs.compatible == 'true'
        run: xcrun swift package resolve

      - name: Verify resolved dependency lock
        if: matrix.xcode.required == true && steps.toolchain-compatibility.outputs.compatible == 'true'
        run: |
          test -f Package.resolved
          git ls-files --error-unmatch Package.resolved >/dev/null
          git diff --exit-code -- Package.resolved

      - name: Verify resolved dependency snapshot
        if: matrix.xcode.required == true && steps.toolchain-compatibility.outputs.compatible == 'true'
        run: |
          output_root="$RUNNER_TEMP/innonetwork-dependency-dry-run"
          mkdir -p "$output_root"
          python3 Scripts/generate_dependency_snapshot.py \
            --package-resolved \
            Package.resolved \
            "$output_root/snapshot.json"

      - name: Build (Swift 6 language mode)
        if: steps.toolchain-compatibility.outputs.compatible == 'true'
        run: |
          set -eo pipefail
          echo "🔨 Building InnoNetwork..."
          xcrun swift --version
          # Swift 6 language mode is enabled per-target in Package.swift, so
          # strict concurrency is always in effect without an explicit flag.
          xcrun swift build
          echo "✅ Build completed successfully!"

      - name: Test (with code coverage)
        if: steps.toolchain-compatibility.outputs.compatible == 'true'
        run: |
          set -eo pipefail
          echo "🧪 Running tests with --enable-code-coverage..."
          # Coverage instrumentation makes the macOS Actions runner much more
          # scheduler-sensitive; keep this run non-parallel so wall-clock
          # polling tests do not starve under runner load.
          xcrun swift test --no-parallel --enable-code-coverage
          echo "✅ Tests completed successfully!"

      - name: Generate runtime coverage report
        if: steps.toolchain-compatibility.outputs.compatible == 'true'
        run: |
          set -euo pipefail

          runtime_source_roots=()
          while IFS= read -r source_root; do
            runtime_source_roots+=("$source_root")
          done < <(
            find Sources -mindepth 1 -maxdepth 1 -type d \
              ! -name InnoNetworkMacros -print | sort
          )

          bash Scripts/generate_coverage_report.sh \
            .build \
            .build/coverage \
            "${runtime_source_roots[@]}"

      - name: Upload coverage artifact
        if: always() && steps.toolchain-compatibility.outputs.compatible == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Suffix the artifact name with the matrix label so the
          # parallel toolchain runs do not race on a shared upload
          # slot.
          name: innonetwork-coverage-${{ matrix.xcode.label }}
          path: .build/coverage/
          if-no-files-found: error

      - name: Enforce @unchecked Sendable policy
        if: steps.toolchain-compatibility.outputs.compatible == 'true'
        run: bash Scripts/check_unchecked_sendable.sh

      - name: Enforce SharedCoders immutability
        if: steps.toolchain-compatibility.outputs.compatible == 'true'
        run: bash Scripts/check_shared_coders_mutation.sh

      - name: Enforce no force unwrap in production sources
        if: steps.toolchain-compatibility.outputs.compatible == 'true'
        run: bash Scripts/check_production_force_unwraps.sh

      - name: Enforce no print() in production sources
        if: steps.toolchain-compatibility.outputs.compatible == 'true'
        run: bash Scripts/check_no_print_in_production.sh

      - name: Report cache observations
        if: always()
        run: python3 -B Scripts/ci-cache.py report --profile build-and-test

  upload-core-coverage:
    name: Upload Core Coverage
    needs: [ci-plan, build-and-test]
    if: fromJSON(needs.ci-plan.outputs.plan).jobs.upload-core-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download canonical coverage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: innonetwork-coverage-26.0.1
          path: .build/coverage

      - name: Install Codecov CLI v11.3.1
        id: install-codecov-cli
        continue-on-error: ${{ !(github.event_name == 'push' && github.repository == 'InnoSquadCorp/InnoNetwork') }}
        env:
          CODECOV_CLI_VERSION: "v11.3.1"
          CODECOV_CLI_SHA256: "ca1d64196d2d34771084afe76ea657d581bf628e31d993ff8e52ea09cc88a56d"
        run: |
          set -euo pipefail

          binary="$RUNNER_TEMP/codecov-$CODECOV_CLI_VERSION"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$binary" \
            "https://cli.codecov.io/$CODECOV_CLI_VERSION/linux/codecov"
          printf '%s  %s\n' "$CODECOV_CLI_SHA256" "$binary" \
            | sha256sum -c -
          chmod 0755 "$binary"
          "$binary" --version

      - name: Report artifact-only Codecov fallback
        if: ${{ always() && steps.install-codecov-cli.outcome != 'success' }}
        run: echo "::notice::Codecov CLI installation failed; retaining the uploaded coverage artifact without a Codecov upload."

      - name: Upload coverage to Codecov
        if: steps.install-codecov-cli.outcome == 'success'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          binary: ${{ runner.temp }}/codecov-v11.3.1
          use_oidc: true
          files: .build/coverage/coverage.lcov
          disable_search: true
          # The same runtime report feeds both flags; codecov.yml path
          # filters partition it so the test-support product no longer
          # dilutes the core request-path signal.
          flags: core,testsupport
          name: core-coverage
          # Fail the build when upload fails on canonical main pushes so a
          # Codecov outage does not silently drop coverage from the project
          # gate. PRs keep the artifact-only fallback non-blocking.
          fail_ci_if_error: ${{ github.event_name == 'push' && github.repository == 'InnoSquadCorp/InnoNetwork' }}


  parallel-tests:
    needs: ci-plan
    name: Test (Bounded Target Shards) — Xcode 26.0.1
    if: needs.ci-plan.outputs.parallel-tests == 'true'
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.1.app

      - name: Cache SwiftPM artifacts
        uses: ./.github/actions/swiftpm-cache
        with:
          profile: parallel-tests

      - name: Show Xcode and Swift versions
        run: |
          xcodebuild -version
          xcrun swift --version

      - name: Resolve dependencies
        run: xcrun swift package resolve

      - name: Run bounded target-sharded tests
        run: |
          set -eo pipefail
          # Swift Testing 6.2 ignores SwiftPM's --num-workers value. Keep the
          # coverage lane serial, then load four target-filtered copies of the
          # built test bundle so hosted concurrency is actually bound.
          bash Scripts/run_bounded_parallel_tests.sh

      - name: Report cache observations
        if: always()
        run: python3 -B Scripts/ci-cache.py report --profile parallel-tests

  docs-contract-sync:
    needs: ci-plan
    name: Docs / Contract Sync
    if: fromJSON(needs.ci-plan.outputs.plan).jobs.docs-contract-sync
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app

      - name: Cache SwiftPM artifacts
        uses: ./.github/actions/swiftpm-cache
        with:
          profile: docs-contract-sync

      - name: Show Xcode and Swift versions
        run: |
          xcodebuild -version
          xcrun swift --version

      - name: Resolve dependencies
        run: xcrun swift package resolve

      - name: Test docs-contract assertion helpers
        run: bash Scripts/tests/test_docs_contract_helpers.sh

      - name: Verify docs and stability contract
        run: |
          bash Scripts/tests/test_validate_6_release_state.sh
          bash Scripts/check_docs_contract_sync.sh

      - name: Verify guarded benchmark contract
        run: |
          bash Scripts/check_guarded_benchmark_contract.sh
          bash Scripts/tests/test_check_guarded_benchmark_contract.sh
          bash Scripts/tests/test_run_same_runner_benchmarks.sh
          python3 Scripts/tests/test_run_with_guarded_benchmarks.py

      - name: Verify repeated macro build baselines
        run: |
          python3 Scripts/check_macro_build_baseline_contract.py
          python3 Scripts/tests/test_check_macro_build_baseline_contract.py

      - name: Verify public API tier fixtures
        run: |
          python3 Scripts/tests/test_check_public_api_tiers.py
          python3 Scripts/check_required_status_checks.py
          python3 Scripts/tests/test_check_required_status_checks.py

      - name: Verify dependency snapshot conversion
        run: bash Scripts/tests/test_generate_dependency_snapshot.sh

      - name: Verify local release preflight contract
        run: |
          bash Scripts/tests/test_run_local_release_preflight.sh

      - name: Verify release workflow contract
        run: |
          bash Scripts/tests/test_validate_release_candidate.sh
          python3 Scripts/check_release_workflow_contract.py
          python3 Scripts/tests/test_check_release_workflow_contract.py

      - name: Verify DocC archive contract
        run: bash Scripts/tests/test_check_docc_archives.sh

      - name: Verify stable examples contract
        run: bash Scripts/check_stable_examples.sh

      - name: Verify example deployment floors
        run: |
          python3 Scripts/check_example_platform_floors.py
          python3 Scripts/tests/test_check_example_platform_floors.py
          bash Scripts/tests/test_build_consumer_examples.sh
          ruby Scripts/check_consumer_ci_contract.rb
          ruby Scripts/tests/test_consumer_ci_contract.rb
          python3 Scripts/tests/test_consumer_ci.py
          python3 Scripts/check_apple_platform_build_contract.py
          python3 Scripts/tests/test_check_apple_platform_build_contract.py

      - name: Verify migration guide code blocks compile
        run: bash Scripts/check_migration_examples.sh

      - name: Verify CHANGELOG Unreleased section
        run: bash Scripts/check_changelog_sync.sh

      - name: Verify provisionally stable enum case ledger
        run: bash Scripts/check_provisional_enum_cases.sh

      - name: Build documentation smoke target
        run: xcrun swift build --target InnoNetworkDocSmoke

      - name: Run documentation smoke target
        run: xcrun swift run InnoNetworkDocSmoke

      - name: Verify resumable upload recovery across process exit
        run: bash Scripts/test_resumable_process_recovery.sh

      - name: Report cache observations
        if: always()
        run: python3 -B Scripts/ci-cache.py report --profile docs-contract-sync

  apple-platform-build-smoke:
    needs: ci-plan
    name: Apple Platform Build Smoke
    if: needs.ci-plan.outputs.apple-platform-build-smoke == 'true'
    runs-on: macos-15
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        # Every declared platform is an unconditional hard gate.
        include:
          - destination: "platform=macOS"
            runtime: "macOS"
            sdk: "macosx"
            builder: "xcodebuild"
          - destination: "generic/platform=iOS Simulator"
            runtime: "iOS"
            sdk: "iphonesimulator"
            builder: "xcodebuild"
          - triple: "arm64-apple-tvos16.0"
            runtime: "tvOS"
            sdk: "appletvos"
            builder: "swiftpm-cross"
          - triple: "arm64_32-apple-watchos9.0"
            runtime: "watchOS"
            sdk: "watchos"
            builder: "swiftpm-cross"
          - triple: "arm64-apple-xros1.0"
            runtime: "visionOS"
            sdk: "xros"
            builder: "swiftpm-cross"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.1.app

      - name: Cache SwiftPM artifacts
        uses: ./.github/actions/swiftpm-cache
        with:
          profile: apple-platform-build-smoke
          variant: ${{ matrix.runtime }}

      - name: Show Xcode and Swift versions
        run: |
          xcodebuild -version
          xcrun swift --version
          xcrun simctl list devicetypes

      - name: Resolve dependencies
        run: xcrun swift package resolve

      - name: Build package for ${{ matrix.runtime }}
        run: |
          set -euo pipefail

          runtime="${{ matrix.runtime }}"
          sdk="${{ matrix.sdk }}"
          builder="${{ matrix.builder }}"

          if ! xcrun --sdk "$sdk" --show-sdk-path >/dev/null 2>&1; then
            echo "::error::Required $runtime SDK $sdk is not installed on the pinned runner."
            exit 1
          fi

          if [[ "$builder" == "swiftpm-cross" ]]; then
            bash Scripts/build_apple_platform_targets.sh \
              "$runtime" \
              "$sdk" \
              '${{ matrix.triple }}'
            exit 0
          fi

          xcodebuild \
            -scheme InnoNetwork-Package \
            -destination '${{ matrix.destination }}' \
            -skipMacroValidation \
            -derivedDataPath build/apple-platform-smoke \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Report cache observations
        if: always()
        run: python3 -B Scripts/ci-cache.py report --profile apple-platform-build-smoke --variant '${{ matrix.runtime }}'

  consumer-smoke:
    name: Consumer Smoke
    # Preserve the protected check name. A skipped/cancelled/failed child is
    # never a successful aggregate (including when an upstream job fails).
    needs: [ci-plan, consumer-examples, consumer-macros, consumer-openapi]
    if: always() && fromJSON(needs.ci-plan.outputs.plan).jobs.consumer-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require all consumer lanes to succeed
        env:
          CONSUMER_JOB_RESULTS: >-
            {"consumer-examples": ${{ toJSON(needs.consumer-examples) }}, "consumer-macros": ${{ toJSON(needs.consumer-macros) }}, "consumer-openapi": ${{ toJSON(needs.consumer-openapi) }}}
        run: python3 Scripts/check_consumer_ci_results.py


  consumer-examples:
    needs: ci-plan
    name: Consumer Examples
    if: fromJSON(needs.ci-plan.outputs.plan).jobs.consumer-examples
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.1.app

      - name: Show Xcode and Swift versions
        run: |
          xcodebuild -version
          xcrun swift --version

      - name: Restore isolated consumer build caches
        uses: ./.github/actions/consumer-cache
        with:
          lane: examples

      - name: Verify macro trait manifest and default graph
        run: bash Scripts/check_macro_trait_graphs.sh

      - name: Build root core without default traits
        run: bash Scripts/check_core_trait_build.sh

      - name: Build all independent consumer examples
        run: bash Scripts/build_consumer_examples.sh

      - name: Run macro adopter smoke
        run: xcrun swift run --package-path Examples/MacroAdopterSmoke

      - name: Run OpenAPI adopter smoke
        run: xcrun swift run --package-path Examples/OpenAPIAdopterSmoke

      - name: Report cache observations
        if: always()
        run: python3 -B Scripts/ci-cache.py report --profile consumer-examples

  consumer-macros:
    needs: ci-plan
    name: Consumer Macros
    if: fromJSON(needs.ci-plan.outputs.plan).jobs.consumer-macros
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app

      - name: Restore isolated consumer build caches
        uses: ./.github/actions/consumer-cache
        with:
          lane: macros

      - name: Test macros from source (with code coverage)
        run: |
          xcrun swift test \
            --disable-experimental-prebuilts \
            --filter InnoNetworkMacroTests \
            --enable-code-coverage

      - name: Verify macro compile-failure diagnostics
        run: bash Scripts/check_macro_compile_failures.sh

      - name: Generate macro coverage report
        run: |
          bash Scripts/generate_coverage_report.sh \
            .build \
            .build/coverage-macros \
            Sources/InnoNetworkMacros

      - name: Upload macro coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: innonetwork-coverage-macros
          path: .build/coverage-macros/
          if-no-files-found: error

      - name: Report cache observations
        if: always()
        run: python3 -B Scripts/ci-cache.py report --profile consumer-macros

  consumer-openapi:
    needs: ci-plan
    name: Consumer OpenAPI
    if: fromJSON(needs.ci-plan.outputs.plan).jobs.consumer-openapi
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app

      - name: Restore isolated consumer build caches
        uses: ./.github/actions/consumer-cache
        with:
          lane: openapi

      - name: Build openapi-to-innonetwork CLI
        working-directory: Tools/openapi-to-innonetwork
        run: xcrun swift build

      - name: Test openapi-to-innonetwork CLI
        working-directory: Tools/openapi-to-innonetwork
        run: xcrun swift test

      - name: Typecheck generated OpenAPI output
        run: bash Scripts/test_openapi_generated_output.sh

      - name: Report cache observations
        if: always()
        run: python3 -B Scripts/ci-cache.py report --profile consumer-openapi

  upload-macro-coverage:
    name: Upload Macro Coverage
    needs: [ci-plan, consumer-macros]
    if: fromJSON(needs.ci-plan.outputs.plan).jobs.upload-macro-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download macro coverage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: innonetwork-coverage-macros
          path: .build/coverage-macros

      - name: Install Codecov CLI v11.3.1
        id: install-codecov-cli
        continue-on-error: ${{ !(github.event_name == 'push' && github.repository == 'InnoSquadCorp/InnoNetwork') }}
        env:
          CODECOV_CLI_VERSION: "v11.3.1"
          CODECOV_CLI_SHA256: "ca1d64196d2d34771084afe76ea657d581bf628e31d993ff8e52ea09cc88a56d"
        run: |
          set -euo pipefail

          binary="$RUNNER_TEMP/codecov-$CODECOV_CLI_VERSION"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$binary" \
            "https://cli.codecov.io/$CODECOV_CLI_VERSION/linux/codecov"
          printf '%s  %s\n' "$CODECOV_CLI_SHA256" "$binary" \
            | sha256sum -c -
          chmod 0755 "$binary"
          "$binary" --version

      - name: Report artifact-only Codecov fallback
        if: ${{ always() && steps.install-codecov-cli.outcome != 'success' }}
        run: echo "::notice::Codecov CLI installation failed; retaining the uploaded coverage artifact without a Codecov upload."

      - name: Upload macro coverage to Codecov
        if: steps.install-codecov-cli.outcome == 'success'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          binary: ${{ runner.temp }}/codecov-v11.3.1
          use_oidc: true
          files: .build/coverage-macros/coverage.lcov
          disable_search: true
          flags: macros
          name: macro-coverage
          fail_ci_if_error: ${{ github.event_name == 'push' && github.repository == 'InnoSquadCorp/InnoNetwork' }}


  benchmark-smoke:
    needs: ci-plan
    name: Benchmark Smoke
    if: fromJSON(needs.ci-plan.outputs.plan).jobs.benchmark-smoke
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.1.app

      - name: Cache SwiftPM artifacts
        uses: ./.github/actions/swiftpm-cache
        with:
          profile: benchmark-smoke

      - name: Show Xcode and Swift versions
        run: |
          xcodebuild -version
          xcrun swift --version

      - name: Resolve dependencies
        run: xcrun swift package resolve

      - name: Run benchmark smoke
        run: |
          mkdir -p .build/benchmarks
          xcrun swift run -c release InnoNetworkBenchmarks \
            --quick \
            --json-path .build/benchmarks/results.json

      - name: Upload benchmark smoke artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: innonetwork-benchmark-smoke
          path: .build/benchmarks/results.json
          if-no-files-found: error

      - name: Report cache observations
        if: always()
        run: python3 -B Scripts/ci-cache.py report --profile benchmark-smoke

  codeql:
    name: CodeQL / Swift
    needs: ci-plan
    if: fromJSON(needs.ci-plan.outputs.plan).jobs.codeql
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
      # CodeQL needs to publish results into the security tab and read
      # action metadata to discover queries.
      actions: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [swift]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.1.app

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          # `security-extended` adds higher-signal queries beyond the default
          # `security-and-quality` pack. Swift coverage in CodeQL is still
          # maturing, so we run both packs and rely on triage to suppress
          # false positives via per-issue dismissals.
          queries: security-extended,security-and-quality

      - name: Build
        run: |
          set -eo pipefail
          xcrun swift --version
          xcrun swift build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"

  thread-sanitizer:
    name: Tests under ThreadSanitizer
    needs: ci-plan
    if: needs.ci-plan.outputs.thread-sanitizer == 'true'
    runs-on: xcode-27
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Cache SwiftPM artifacts
        uses: ./.github/actions/swiftpm-cache
        with:
          profile: thread-sanitizer

      - name: Show Xcode and Swift versions
        run: |
          xcodebuild -version
          xcrun swift --version

      - name: Resolve dependencies
        run: xcrun swift package resolve

      - name: Run tests under ThreadSanitizer
        env:
          # Surface warnings as hard failures so flaky races are caught.
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: |
          set -eo pipefail
          xcrun swift test \
            --sanitize thread \
            --no-parallel

      - name: Report cache observations
        if: always()
        run: python3 -B Scripts/ci-cache.py report --profile thread-sanitizer

  benchmarks:
    name: Run Benchmarks
    needs: ci-plan
    if: fromJSON(needs.ci-plan.outputs.plan).jobs.benchmarks
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.1.app

      - name: Cache SwiftPM artifacts
        uses: ./.github/actions/swiftpm-cache
        with:
          profile: benchmarks

      - name: Show Xcode and Swift versions
        run: |
          xcodebuild -version
          xcrun swift --version

      - name: Test benchmark report tooling
        run: |
          python3 Scripts/tests/test_compare_benchmark_runs.py
          python3 Scripts/tests/test_run_with_guarded_benchmarks.py
          bash Scripts/tests/test_run_same_runner_benchmarks.sh

      - name: Verify guarded benchmark contract
        run: |
          bash Scripts/check_guarded_benchmark_contract.sh
          bash Scripts/tests/test_check_guarded_benchmark_contract.sh

      - name: Compare same-runner benchmark medians
        env:
          PR_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          MAX_REGRESSION_PERCENT: "20"
        run: |
          set -euo pipefail
          arguments=(
            --output-dir .build/benchmarks
            --max-regression-percent "$MAX_REGRESSION_PERCENT"
          )
          if [[ -n "$PR_BASE_SHA" ]]; then
            arguments+=(--base-revision "$PR_BASE_SHA")
          fi
          bash Scripts/run_same_runner_benchmarks.sh "${arguments[@]}"

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: innonetwork-benchmarks
          path: .build/benchmarks/
          if-no-files-found: error

      - name: Report cache observations
        if: always()
        run: python3 -B Scripts/ci-cache.py report --profile benchmarks

  documentation:
    name: Build DocC Site
    needs: ci-plan
    if: fromJSON(needs.ci-plan.outputs.plan).jobs.documentation
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app

      - name: Cache SwiftPM artifacts
        uses: ./.github/actions/swiftpm-cache
        with:
          profile: documentation

      - name: Show Xcode and Swift versions
        run: |
          xcodebuild -version
          xcrun swift --version

      - name: Verify DocC archive contract fixtures
        run: bash Scripts/tests/test_check_docc_archives.sh

      - name: Build DocC archives
        run: |
          xcodebuild docbuild \
            -scheme InnoNetwork-Package \
            -destination 'generic/platform=macOS' \
            -skipMacroValidation \
            -derivedDataPath .build/DocC

      - name: Verify public DocC archives
        run: bash Scripts/check_docc_archives.sh .build/DocC

      - name: Transform DocC archives for static hosting
        env:
          BASE_PATH: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail

          SITE_DIR=".build/docc-site"
          rm -rf "$SITE_DIR"
          mkdir -p "$SITE_DIR"
          touch "$SITE_DIR/.nojekyll"

          while IFS= read -r module; do
            archive="$(find .build/DocC/Build/Products -type d -path "*/${module}.doccarchive" -print -quit)"
            if [[ -z "$archive" || ! -d "$archive" ]]; then
              echo "Missing DocC archive for module: $module"
              exit 1
            fi

            xcrun docc process-archive transform-for-static-hosting "$archive" \
              --output-path "$SITE_DIR/$module" \
              --hosting-base-path "$BASE_PATH/$module"
          done < docs/public-docc-products.txt

          cp docs/site/index.html "$SITE_DIR/index.html"

      - name: Validate DocC site files
        run: |
          set -euo pipefail

          SITE_DIR=".build/docc-site"
          test -f "$SITE_DIR/.nojekyll"
          test -s "$SITE_DIR/index.html"

          while IFS= read -r module; do
            slug="$(printf '%s' "$module" | tr '[:upper:]' '[:lower:]')"
            route="./${module}/documentation/${slug}"

            test -s "$SITE_DIR/${module}/index.html"
            test -s "$SITE_DIR/${module}/documentation/${slug}/index.html"
            test -s "$SITE_DIR/${module}/data/documentation/${slug}.json"
            grep -Fq "href=\"${route}" "$SITE_DIR/index.html"
          done < docs/public-docc-products.txt

      - name: Upload Documentation Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: .build/docc-site

      - name: Report cache observations
        if: always()
        run: python3 -B Scripts/ci-cache.py report --profile documentation

  release-candidate:
    name: Release Candidate
    needs: ci-plan
    if: fromJSON(needs.ci-plan.outputs.plan).jobs.release-candidate
    uses: ./.github/workflows/release-validation.yml
    with:
      publish: false


  ci-required:
    name: CI Required
    if: always()
    needs: [ci-plan, policy, dependency-review, lint, dead-code, build-and-test, upload-core-coverage, parallel-tests, docs-contract-sync, apple-platform-build-smoke, consumer-smoke, consumer-examples, consumer-macros, consumer-openapi, upload-macro-coverage, benchmark-smoke, codeql, thread-sanitizer, benchmarks, documentation, release-candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require every planned CI result
        env:
          GH_TOKEN: ${{ github.token }}
          CI_REUSE: ${{ needs.ci-plan.outputs.reuse }}
          CI_PLAN: ${{ needs.ci-plan.outputs.plan }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 -B Scripts/ci-policy.py evaluate
