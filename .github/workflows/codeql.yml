name: CodeQL

on:
  schedule:
    # Weekly scan on Mondays at 06:00 UTC (~15:00 KST). Catches new
    # query versions that ship between PRs without forcing a per-PR
    # full analysis.
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL / Swift
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
      # CodeQL needs to publish results into the security tab and read
      # action metadata to discover queries.
      actions: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [swift]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.1.app

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          # `security-extended` adds higher-signal queries beyond the default
          # `security-and-quality` pack. Swift coverage in CodeQL is still
          # maturing, so we run both packs and rely on triage to suppress
          # false positives via per-issue dismissals.
          queries: security-extended,security-and-quality

      - name: Build
        run: |
          set -eo pipefail
          xcrun swift --version
          xcrun swift build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:${{ matrix.language }}"

  analyze-cross-platform:
    name: CodeQL / ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node
        if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Platforms/Web/package-lock.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Build Android library
        if: matrix.language == 'java-kotlin'
        run: |
          Scripts/check_android_wrapper_integrity.sh
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"
          # Extraction must observe compilation, not restore compiled Gradle outputs.
          Platforms/Android/gradlew -p Platforms/Android \
            --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks \
            -Pkotlin.incremental=false assemble :innonetwork-ksp:classes

      - name: Build Web library
        if: matrix.language == 'javascript-typescript'
        working-directory: Platforms/Web
        run: |
          npm ci --ignore-scripts --no-audit
          npm run build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:${{ matrix.language }}"
