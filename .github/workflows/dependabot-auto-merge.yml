name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review, converted_to_draft, closed]
  workflow_run:
    workflows: [CI, Dependabot Review Notice]
    types: [requested, in_progress, completed]
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.repository == 'InnoSquadCorp/InnoNetwork' && github.ref == 'refs/heads/main' && github.workflow_ref == 'InnoSquadCorp/InnoNetwork/.github/workflows/dependabot-auto-merge.yml@refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    outputs:
      bot_prs: ${{ steps.targets.outputs.bot_prs }}
      manual_prs: ${{ steps.targets.outputs.manual_prs }}
    steps:
      - name: Checkout trusted coordinator only
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/heads/main
          persist-credentials: false
          sparse-checkout: Scripts
      - name: Resolve authoritative API targets
        id: targets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B Scripts/dependabot-merge-policy.py targets

  manual-ready:
    needs: inspect
    if: needs.inspect.result == 'success' && github.ref == 'refs/heads/main' && github.workflow_ref == 'InnoSquadCorp/InnoNetwork/.github/workflows/dependabot-auto-merge.yml@refs/heads/main' && needs.inspect.outputs.manual_prs != '[]' && needs.inspect.outputs.manual_prs != ''
    strategy:
      matrix:
        pr: ${{ fromJSON(needs.inspect.outputs.manual_prs) }}
    concurrency:
      group: dependabot-ready-${{ matrix.pr }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      checks: write
      pull-requests: read
    steps:
      - name: Checkout trusted coordinator only
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/heads/main
          persist-credentials: false
          sparse-checkout: Scripts
      - name: Complete manual policy check without enabling auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ matrix.pr }}
          DEPENDABOT_AUTO_MERGE_ENABLED: 'false'
        run: python3 -B Scripts/dependabot-merge-policy.py coordinate --pr "$PR_NUMBER"

  bot-ready:
    needs: inspect
    if: needs.inspect.result == 'success' && github.ref == 'refs/heads/main' && github.workflow_ref == 'InnoSquadCorp/InnoNetwork/.github/workflows/dependabot-auto-merge.yml@refs/heads/main' && needs.inspect.outputs.bot_prs != '[]' && needs.inspect.outputs.bot_prs != ''
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.inspect.outputs.bot_prs) }}
    concurrency:
      group: dependabot-ready-${{ matrix.pr }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout trusted coordinator only
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/heads/main
          persist-credentials: false
          sparse-checkout: Scripts
      - name: Gate native auto-merge on exact current CI proof
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ matrix.pr }}
          DEPENDABOT_AUTO_MERGE_ENABLED: ${{ vars.DEPENDABOT_AUTO_MERGE_ENABLED }}
        run: python3 -B Scripts/dependabot-merge-policy.py coordinate --pr "$PR_NUMBER"

  post-merge:
    if: ${{ always() && needs.inspect.result == 'success' && github.repository == 'InnoSquadCorp/InnoNetwork' && github.ref == 'refs/heads/main' && github.workflow_ref == 'InnoSquadCorp/InnoNetwork/.github/workflows/dependabot-auto-merge.yml@refs/heads/main' && vars.DEPENDABOT_AUTO_MERGE_ENABLED == 'true' }}
    needs: [inspect, manual-ready, bot-ready]
    concurrency:
      group: dependabot-post-merge
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      - name: Checkout trusted coordinator only
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/heads/main
          persist-credentials: false
          sparse-checkout: Scripts
      - name: Reconcile actual bot merge and only its current-main CI
        env:
          GH_TOKEN: ${{ github.token }}
          DEPENDABOT_AUTO_MERGE_ENABLED: ${{ vars.DEPENDABOT_AUTO_MERGE_ENABLED }}
        run: python3 -B Scripts/dependabot-merge-policy.py post-merge
