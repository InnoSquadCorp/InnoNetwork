name: Dependabot Review Notice

on:
  pull_request_review:
    types: [submitted, dismissed, edited]
  pull_request_review_comment:
    types: [created, deleted, edited]

# A PR-context wake-up has no token permissions, secrets, checkout, artifacts,
# cache or dependencies. The default-branch workflow_run consumer re-reads APIs.
permissions: {}

jobs:
  notice:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Notify trusted metadata reconciliation
        run: echo 'Review metadata changed; trusted coordinator will re-query GitHub.'
