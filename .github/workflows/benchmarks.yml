name: Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-benchmarks:
    name: Run Benchmarks
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.1.app

      - name: Cache SwiftPM artifacts
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            .build/checkouts
            .build/repositories
            .build/swiftpm-cache
          key: ${{ runner.os }}-bench-xcode-26.0.1-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-bench-xcode-26.0.1-

      - name: Show Xcode and Swift versions
        run: |
          xcodebuild -version
          xcrun swift --version

      - name: Test benchmark report tooling
        run: |
          python3 Scripts/tests/test_compare_benchmark_runs.py
          python3 Scripts/tests/test_run_with_guarded_benchmarks.py
          bash Scripts/tests/test_run_same_runner_benchmarks.sh

      - name: Verify guarded benchmark contract
        run: |
          bash Scripts/check_guarded_benchmark_contract.sh
          bash Scripts/tests/test_check_guarded_benchmark_contract.sh

      - name: Compare same-runner benchmark medians
        env:
          PR_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          MAX_REGRESSION_PERCENT: "20"
        run: |
          set -euo pipefail
          arguments=(
            --output-dir .build/benchmarks
            --max-regression-percent "$MAX_REGRESSION_PERCENT"
          )
          if [[ -n "$PR_BASE_SHA" ]]; then
            arguments+=(--base-revision "$PR_BASE_SHA")
          fi
          bash Scripts/run_same_runner_benchmarks.sh "${arguments[@]}"

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: innonetwork-benchmarks
          path: .build/benchmarks/
          if-no-files-found: error

  append-trend:
    name: Append benchmark trend
    if: success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: run-benchmarks
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download benchmark artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: innonetwork-benchmarks
          path: .build/benchmarks

      - name: Append benchmark trend to benchmark-trends branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          trend_dir="$(mktemp -d)"
          git fetch origin benchmark-trends || true
          if git show-ref --verify --quiet refs/remotes/origin/benchmark-trends; then
            git worktree add "$trend_dir" origin/benchmark-trends
          else
            git worktree add --detach "$trend_dir"
            git -C "$trend_dir" switch --orphan benchmark-trends
            git -C "$trend_dir" rm -rf . || true
          fi
          python3 Scripts/append_benchmark_trend.py \
            .build/benchmarks/results.json \
            "$trend_dir/trends/benchmark-results.jsonl"
          python3 Scripts/append_benchmark_trend.py \
            .build/benchmarks/json/results.json \
            "$trend_dir/trends/json-codec-results.jsonl"
          git -C "$trend_dir" add trends/benchmark-results.jsonl trends/json-codec-results.jsonl
          if git -C "$trend_dir" diff --cached --quiet; then
            exit 0
          fi
          git -C "$trend_dir" commit -m "Append benchmark trend for ${GITHUB_SHA}"
          git -C "$trend_dir" push origin HEAD:benchmark-trends
