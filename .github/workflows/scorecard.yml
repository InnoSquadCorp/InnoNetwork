name: OpenSSF Scorecard

on:
  # Run on every push to main so the published score never lags the
  # default branch's posture, and weekly to pick up scorer changes.
  push:
    branches:
      - main
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

# The scorecard action needs write permission for the security tab to
# publish SARIF, and id-token for the publish-results option below.
permissions: read-all

concurrency:
  group: scorecard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Needed for SARIF upload to the Security tab.
      security-events: write
      # Needed to publish results & sign attestations.
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # `publish_results: true` posts the score to the public
          # scorecard.dev dashboard so the README badge stays in sync
          # without an external scheduled refresh.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 7

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
