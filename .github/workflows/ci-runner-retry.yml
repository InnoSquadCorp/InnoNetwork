name: CI runner retry

# GitHub-hosted macOS capacity sometimes never assigns a runner. The job is
# cancelled with "not acquired by Runner" and CI fails although no code ran.
# Rerun such a PR run, never one with a real failure; the trusted default-main
# script only reads the API and requests the rerun.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ci-runner-retry-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'failure' && github.repository == 'InnoSquadCorp/InnoNetwork' && github.workflow_ref == 'InnoSquadCorp/InnoNetwork/.github/workflows/ci-runner-retry.yml@refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      checks: read
    steps:
      - name: Checkout trusted retry policy only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: Scripts
      - name: Rerun jobs that never got a runner
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 -B Scripts/ci-runner-retry.py run
