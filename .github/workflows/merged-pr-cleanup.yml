name: Merged PR cleanup

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read

# This is a stateful coordinator; a later notification must not preempt it.
concurrency:
  group: merged-pr-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  inspect:
    if: >-
      github.event.pull_request.merged == true &&
      github.repository == 'InnoSquadCorp/InnoNetwork' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      github.workflow_ref == format('{0}/.github/workflows/merged-pr-cleanup.yml@refs/heads/{1}', github.repository, github.event.repository.default_branch) &&
      !(vars.INNO_MERGED_PR_CLEANUP == '' || vars.INNO_MERGED_PR_CLEANUP == 'enabled')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - name: Checkout immutable trusted cleanup source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Scripts/merged_pr_cleanup.py
            /Scripts/merged_pr_cleanup_plan.py
            /Scripts/ci-cleanup-workflows.json
      - name: Inspect or cancel exact merged PR validation
        env:
          GH_TOKEN: ${{ github.token }}
          CLEANUP_SOURCE_SHA: ${{ github.workflow_sha }}
          # The disabled override retains read-only inspection.
          CLEANUP_ENABLE_WRITES: ''
        run: |
          set -euo pipefail
          args=()
          if [[ "$CLEANUP_ENABLE_WRITES" == 'enabled' ]]; then args+=(--apply); fi
          python3 -B Scripts/merged_pr_cleanup.py --event "$GITHUB_EVENT_PATH" "${args[@]}"

  cleanup:
    if: >-
      github.event.pull_request.merged == true &&
      github.repository == 'InnoSquadCorp/InnoNetwork' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      github.workflow_ref == format('{0}/.github/workflows/merged-pr-cleanup.yml@refs/heads/{1}', github.repository, github.event.repository.default_branch) &&
      (vars.INNO_MERGED_PR_CLEANUP == '' || vars.INNO_MERGED_PR_CLEANUP == 'enabled')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      - name: Checkout immutable trusted cleanup source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Scripts/merged_pr_cleanup.py
            /Scripts/merged_pr_cleanup_plan.py
            /Scripts/ci-cleanup-workflows.json
      - name: Inspect or cancel exact merged PR validation
        env:
          GH_TOKEN: ${{ github.token }}
          CLEANUP_SOURCE_SHA: ${{ github.workflow_sha }}
          # The trusted merged-PR handler applies cleanup by default.
          CLEANUP_ENABLE_WRITES: ${{ (vars.INNO_MERGED_PR_CLEANUP == '' || vars.INNO_MERGED_PR_CLEANUP == 'enabled') && 'enabled' || 'disabled' }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$CLEANUP_ENABLE_WRITES" == 'enabled' ]]; then args+=(--apply); fi
          python3 -B Scripts/merged_pr_cleanup.py --event "$GITHUB_EVENT_PATH" "${args[@]}"
