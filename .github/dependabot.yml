{
  "version": 2,
  "updates": [
    {
      "package-ecosystem": "github-actions",
      "directory": "/",
      "schedule": {
        "interval": "weekly",
        "day": "monday",
        "time": "09:00",
        "timezone": "Asia/Seoul"
      },
      "open-pull-requests-limit": 5,
      "groups": {
        "actions-minor-patch": {
          "patterns": [
            "*"
          ],
          "update-types": [
            "minor",
            "patch"
          ]
        }
      },
      "commit-message": {
        "prefix": "chore(ci)"
      },
      "labels": [
        "dependencies",
        "github-actions",
        "release-validation"
      ]
    },
    {
      "package-ecosystem": "swift",
      "directories": [
        "/",
        "/Tools/openapi-to-innonetwork"
      ],
      "schedule": {
        "interval": "weekly",
        "day": "monday",
        "time": "09:30",
        "timezone": "Asia/Seoul"
      },
      "open-pull-requests-limit": 3,
      "groups": {
        "swift-minor-patch": {
          "patterns": [
            "*"
          ],
          "exclude-patterns": [
            "github.com/swiftlang/swift-syntax"
          ],
          "update-types": [
            "minor",
            "patch"
          ]
        }
      },
      "commit-message": {
        "prefix": "chore(deps)"
      },
      "labels": [
        "dependencies",
        "swift",
        "release-validation"
      ]
    },
    {
      "package-ecosystem": "gradle",
      "directories": [
        "/Platforms/Android",
        "/SmokeTests/AndroidConsumer"
      ],
      "schedule": {
        "interval": "weekly",
        "day": "monday",
        "time": "10:00",
        "timezone": "Asia/Seoul"
      },
      "open-pull-requests-limit": 5,
      "groups": {
        "android-minor-patch": {
          "patterns": [
            "*"
          ],
          "update-types": [
            "minor",
            "patch"
          ]
        }
      },
      "commit-message": {
        "prefix": "chore(android-deps)"
      },
      "labels": [
        "dependencies",
        "android",
        "release-validation"
      ]
    },
    {
      "package-ecosystem": "npm",
      "directories": [
        "/Platforms/Web",
        "/SmokeTests/WebConsumer",
        "/SmokeTests/WebTarballConsumer",
        "/SmokeTests/ReactConsumer"
      ],
      "schedule": {
        "interval": "weekly",
        "day": "monday",
        "time": "10:30",
        "timezone": "Asia/Seoul"
      },
      "open-pull-requests-limit": 5,
      "groups": {
        "web-minor-patch": {
          "patterns": [
            "*"
          ],
          "update-types": [
            "minor",
            "patch"
          ]
        }
      },
      "commit-message": {
        "prefix": "chore(web-deps)"
      },
      "labels": [
        "dependencies",
        "web",
        "release-validation"
      ]
    }
  ]
}
